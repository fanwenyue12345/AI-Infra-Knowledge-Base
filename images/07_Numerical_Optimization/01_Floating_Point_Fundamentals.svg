<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520"><rect width="1100" height="520" rx="22" fill="#f8fafc"/><text x="550" y="45" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#172554">Floating-point representation</text><text x="550" y="100" text-anchor="middle" font-family="Arial" font-size="20" fill="#334155">A normalized binary floating-point number stores sign, exponent and fraction</text><g font-family="Arial" text-anchor="middle"><rect x="120" y="155" width="130" height="100" rx="10" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/><rect x="250" y="155" width="300" height="100" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><rect x="550" y="155" width="430" height="100" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="185" y="195" font-size="23" fill="#991b1b">Sign</text><text x="185" y="225" font-size="17" fill="#991b1b">1 bit</text><text x="400" y="195" font-size="23" fill="#92400e">Exponent</text><text x="400" y="225" font-size="17" fill="#92400e">exponent bits</text><text x="765" y="195" font-size="23" fill="#1e40af">Fraction / significand</text><text x="765" y="225" font-size="17" fill="#1e40af">fraction bits</text></g><text x="550" y="310" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#334155">Format trade-off: exponent range versus precision</text><g font-family="Arial" font-size="19"><text x="120" y="370" fill="#334155">FP32</text><rect x="220" y="345" width="80" height="35" fill="#fee2e2"/><rect x="300" y="345" width="180" height="35" fill="#fef3c7"/><rect x="480" y="345" width="410" height="35" fill="#dbeafe"/><text x="930" y="370" fill="#334155">8 exp / 23 frac</text><text x="120" y="430" fill="#334155">BF16</text><rect x="220" y="405" width="80" height="35" fill="#fee2e2"/><rect x="300" y="405" width="180" height="35" fill="#fef3c7"/><rect x="480" y="405" width="110" height="35" fill="#dbeafe"/><text x="630" y="430" fill="#334155">8 exp / 7 frac</text><text x="120" y="490" fill="#334155">FP16</text><rect x="220" y="465" width="80" height="35" fill="#fee2e2"/><rect x="300" y="465" width="110" height="35" fill="#fef3c7"/><rect x="410" y="465" width="150" height="35" fill="#dbeafe"/><text x="600" y="490" fill="#334155">5 exp / 10 frac</text></g></svg>