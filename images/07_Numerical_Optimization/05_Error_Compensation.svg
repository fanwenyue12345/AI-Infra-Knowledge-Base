<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="540" viewBox="0 0 1100 540"><rect width="1100" height="540" rx="22" fill="#f8fafc"/><text x="550" y="45" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#172554">Compensated summation retains lost low-order information</text><text x="275" y="110" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700" fill="#334155">Naive summation</text><text x="825" y="110" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700" fill="#334155">Kahan summation</text><g font-family="Arial" font-size="19" text-anchor="middle"><rect x="75" y="155" width="400" height="90" rx="14" fill="#fee2e2" stroke="#ef4444"/><text x="275" y="190" fill="#991b1b">s ← fl(s + xᵢ)</text><text x="275" y="220" fill="#991b1b" font-size="16">rounding loss is discarded</text><rect x="625" y="155" width="400" height="90" rx="14" fill="#dcfce7" stroke="#16a34a"/><text x="825" y="190" fill="#166534">s ← fl(s + (xᵢ + c))</text><text x="825" y="220" fill="#166534" font-size="16">track a compensation term c</text><rect x="75" y="305" width="400" height="90" rx="14" fill="#fff1f2" stroke="#fda4af"/><text x="275" y="340" fill="#9f1239">small contribution may vanish</text><text x="275" y="370" fill="#9f1239" font-size="16">when added to a much larger sum</text><rect x="625" y="305" width="400" height="90" rx="14" fill="#ecfdf5" stroke="#6ee7b7"/><text x="825" y="340" fill="#047857">estimate and carry lost bits</text><text x="825" y="370" fill="#047857" font-size="16">recover part of the rounding error later</text></g><text x="550" y="465" text-anchor="middle" font-family="Arial" font-size="18" fill="#475569">Compensation improves many sums, but does not make floating-point arithmetic exact.</text></svg>