<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520"><rect width="1100" height="520" rx="22" fill="#f8fafc"/><text x="550" y="45" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#172554">Numerical error: approximation and cancellation</text><text x="280" y="105" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700" fill="#334155">Rounding to representable values</text><line x1="70" y1="255" x2="490" y2="255" stroke="#64748b" stroke-width="3"/><g fill="#2563eb"><circle cx="110" cy="255" r="7"/><circle cx="200" cy="255" r="7"/><circle cx="290" cy="255" r="7"/><circle cx="380" cy="255" r="7"/><circle cx="470" cy="255" r="7"/></g><g stroke="#64748b" stroke-dasharray="5 5"><path d="M155 180 V290 M245 180 V290 M335 180 V290 M425 180 V290"/></g><circle cx="245" cy="180" r="8" fill="#ef4444"/><path d="M245 190 L245 245" stroke="#ef4444" stroke-width="3"/><text x="245" y="160" text-anchor="middle" font-family="Arial" font-size="17" fill="#b91c1c">exact value</text><text x="280" y="320" text-anchor="middle" font-family="Arial" font-size="17" fill="#64748b">stored numbers are discrete; real values are rounded</text><text x="810" y="105" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700" fill="#334155">Cancellation in subtraction</text><g font-family="Arial" text-anchor="middle"><rect x="600" y="155" width="180" height="70" rx="12" fill="#dbeafe" stroke="#2563eb"/><text x="690" y="198" font-size="23" fill="#1e3a8a">a = 1.234567</text><rect x="820" y="155" width="180" height="70" rx="12" fill="#dbeafe" stroke="#2563eb"/><text x="910" y="198" font-size="23" fill="#1e3a8a">b = 1.234560</text><text x="800" y="275" font-size="24" fill="#334155">a − b</text><path d="M800 230 V255" stroke="#64748b" stroke-width="3"/><rect x="700" y="310" width="200" height="65" rx="12" fill="#fee2e2" stroke="#ef4444"/><text x="800" y="350" font-size="22" fill="#991b1b">0.000007</text></g><text x="550" y="445" text-anchor="middle" font-family="Arial" font-size="18" fill="#475569">When nearby approximate values are subtracted, leading significant digits cancel and relative error can grow.</text></svg>