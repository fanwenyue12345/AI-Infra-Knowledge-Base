<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="540" viewBox="0 0 1100 540"><rect width="1100" height="540" rx="22" fill="#f8fafc"/><text x="550" y="45" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#172554">Stable softmax: subtract the maximum before exponentiation</text><text x="270" y="105" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700" fill="#334155">Naive evaluation</text><text x="820" y="105" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700" fill="#334155">Shifted evaluation</text><g font-family="Arial" font-size="19" text-anchor="middle"><rect x="90" y="145" width="360" height="80" rx="12" fill="#fee2e2" stroke="#ef4444"/><text x="270" y="178" fill="#991b1b">exp(xᵢ)</text><text x="270" y="205" fill="#991b1b" font-size="16">large x may overflow</text><rect x="90" y="270" width="360" height="80" rx="12" fill="#fff1f2" stroke="#fda4af"/><text x="270" y="303" fill="#9f1239">exp(xᵢ) / Σ exp(xⱼ)</text><text x="270" y="330" fill="#9f1239" font-size="16">Inf / NaN can result</text><rect x="640" y="145" width="360" height="80" rx="12" fill="#dcfce7" stroke="#16a34a"/><text x="820" y="178" fill="#166534">m = max(x)</text><text x="820" y="205" fill="#166534" font-size="16">shift all logits by m</text><rect x="640" y="270" width="360" height="80" rx="12" fill="#dbeafe" stroke="#2563eb"/><text x="820" y="303" fill="#1e3a8a">exp(xᵢ − m) / Σ exp(xⱼ − m)</text><text x="820" y="330" fill="#1e3a8a" font-size="16">all exponents are ≤ 0</text><path d="M270 225 V265 M820 225 V265" stroke="#64748b" stroke-width="3"/><text x="550" y="425" text-anchor="middle" font-family="Arial" font-size="20" fill="#334155">Softmax(x − m·1) = Softmax(x)</text><text x="550" y="465" text-anchor="middle" font-family="Arial" font-size="17" fill="#64748b">A mathematically equivalent shift avoids exponential overflow for finite inputs.</text></svg>