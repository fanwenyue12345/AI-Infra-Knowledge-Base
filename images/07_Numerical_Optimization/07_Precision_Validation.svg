<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="540" viewBox="0 0 1100 540"><rect width="1100" height="540" rx="22" fill="#f8fafc"/><text x="550" y="45" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#172554">Precision validation: compare against a reference</text><g font-family="Arial" font-size="19" text-anchor="middle"><rect x="70" y="145" width="220" height="95" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="180" y="183" fill="#1e3a8a">Reference</text><text x="180" y="213" fill="#1e3a8a" font-size="16">FP64 / trusted baseline</text><rect x="810" y="145" width="220" height="95" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="920" y="183" fill="#92400e">Candidate</text><text x="920" y="213" fill="#92400e" font-size="16">optimized / lower precision</text><path d="M290 192 H430 M670 192 H810" stroke="#64748b" stroke-width="3"/><rect x="430" y="145" width="240" height="95" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="550" y="183" fill="#5b21b6">Compare outputs</text><text x="550" y="213" fill="#5b21b6" font-size="16">abs / relative error</text><path d="M550 240 V310" stroke="#64748b" stroke-width="3"/><rect x="370" y="310" width="360" height="90" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="550" y="347" fill="#166534">Check tolerances + task criteria</text><text x="550" y="376" fill="#166534" font-size="16">finite values, gradients, convergence</text><path d="M550 400 V445" stroke="#64748b" stroke-width="3"/><text x="550" y="480" fill="#334155">Pass / investigate / reject</text></g></svg>