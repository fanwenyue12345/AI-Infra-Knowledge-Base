<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560"><rect width="1100" height="560" rx="22" fill="#f8fafc"/><text x="550" y="45" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#172554">Mixed-precision training: fast compute, careful updates</text><g font-family="Arial" text-anchor="middle" font-size="19"><rect x="80" y="130" width="220" height="85" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="190" y="165" fill="#1e3a8a">FP32 master weights</text><text x="190" y="192" fill="#1e3a8a" font-size="16">optimizer state</text><rect x="440" y="130" width="220" height="85" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="550" y="165" fill="#92400e">Cast to FP16 / BF16</text><text x="550" y="192" fill="#92400e" font-size="16">model compute copy</text><rect x="800" y="130" width="220" height="85" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="910" y="165" fill="#166534">Forward + backward</text><text x="910" y="192" fill="#166534" font-size="16">low-precision GEMM</text><path d="M300 172 H435 M660 172 H795" stroke="#64748b" stroke-width="3"/><path d="M425 162 L437 172 L425 182 M785 162 L797 172 L785 182" stroke="#64748b" stroke-width="3" fill="none"/><rect x="440" y="320" width="220" height="85" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="550" y="355" fill="#5b21b6">Gradient / loss scale</text><text x="550" y="382" fill="#5b21b6" font-size="16">as needed for FP16</text><rect x="800" y="320" width="220" height="85" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="910" y="355" fill="#1e3a8a">FP32 update</text><text x="910" y="382" fill="#1e3a8a" font-size="16">preserve small updates</text><path d="M910 215 V270 H550 V315 M660 362 H795" stroke="#64748b" stroke-width="3" fill="none"/><path d="M785 352 L797 362 L785 372" stroke="#64748b" stroke-width="3" fill="none"/><path d="M910 405 V455 H190 V220" stroke="#2563eb" stroke-width="3" fill="none"/><text x="550" y="500" text-anchor="middle" font-family="Arial" font-size="18" fill="#475569">Not every operation uses low precision: sensitive reductions, normalization and updates may accumulate in FP32.</text></g></svg>