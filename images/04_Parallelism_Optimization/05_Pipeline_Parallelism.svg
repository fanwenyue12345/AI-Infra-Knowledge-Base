<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600"><rect width="1100" height="600" rx="22" fill="#f8fafc"/><text x="550" y="42" text-anchor="middle" font-family="Arial" font-size="27" font-weight="bold" fill="#172554">Pipeline parallelism: micro-batches flow through stages</text><text x="80" y="145" font-family="Arial" font-size="19" fill="#334155">Stage / time</text><g font-family="Arial" font-size="18" text-anchor="middle"><text x="270" y="115" fill="#334155">t1</text><text x="430" y="115" fill="#334155">t2</text><text x="590" y="115" fill="#334155">t3</text><text x="750" y="115" fill="#334155">t4</text><text x="910" y="115" fill="#334155">t5</text><text x="100" y="210" fill="#334155">GPU 0</text><text x="100" y="320" fill="#334155">GPU 1</text><text x="100" y="430" fill="#334155">GPU 2</text><g fill="#dbeafe" stroke="#2563eb"><rect x="190" y="165" width="150" height="65" rx="9"/><rect x="350" y="275" width="150" height="65" rx="9"/><rect x="510" y="385" width="150" height="65" rx="9"/></g><g fill="#2563eb"><rect x="350" y="165" width="150" height="65" rx="9"/><rect x="510" y="275" width="150" height="65" rx="9"/><rect x="670" y="385" width="150" height="65" rx="9"/></g><g fill="#93c5fd"><rect x="510" y="165" width="150" height="65" rx="9"/><rect x="670" y="275" width="150" height="65" rx="9"/><rect x="830" y="385" width="150" height="65" rx="9"/></g><g fill="#1e3a8a"><text x="265" y="205">MB1</text><text x="425" y="205">MB2</text><text x="585" y="205">MB3</text><text x="425" y="315">MB1</text><text x="585" y="315">MB2</text><text x="745" y="315">MB3</text><text x="585" y="425">MB1</text><text x="745" y="425">MB2</text><text x="905" y="425">MB3</text></g></g><text x="550" y="510" text-anchor="middle" font-family="Arial" font-size="18" fill="#475569">Diagonal scheduling lets different stages process different micro-batches concurrently.</text><text x="550" y="545" text-anchor="middle" font-family="Arial" font-size="16" fill="#64748b">Empty cells at pipeline startup and drain represent bubbles.</text></svg>