<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520"><rect width="1000" height="520" rx="22" fill="#f8fafc"/><text x="500" y="42" text-anchor="middle" font-family="Arial" font-size="27" font-weight="bold" fill="#172554">Load balancing across workers</text><text x="250" y="100" text-anchor="middle" font-family="Arial" font-size="21" fill="#334155">Imbalanced assignment</text><text x="750" y="100" text-anchor="middle" font-family="Arial" font-size="21" fill="#334155">Balanced assignment</text><g font-family="Arial" font-size="18" text-anchor="middle"><g fill="#dbeafe" stroke="#2563eb"><rect x="80" y="145" width="340" height="55" rx="9"/><rect x="80" y="220" width="110" height="55" rx="9"/><rect x="80" y="295" width="110" height="55" rx="9"/></g><g fill="#1e40af"><text x="250" y="180">Worker 0: many tasks</text><text x="135" y="255">W1</text><text x="135" y="330">W2</text></g><g fill="#dcfce7" stroke="#16a34a"><rect x="580" y="145" width="150" height="55" rx="9"/><rect x="750" y="145" width="150" height="55" rx="9"/><rect x="580" y="220" width="150" height="55" rx="9"/><rect x="750" y="220" width="150" height="55" rx="9"/><rect x="580" y="295" width="150" height="55" rx="9"/><rect x="750" y="295" width="150" height="55" rx="9"/></g><g fill="#166534"><text x="655" y="180">W0: 2 tasks</text><text x="825" y="180">W1: 2 tasks</text><text x="655" y="255">W2: 2 tasks</text><text x="825" y="255">W3: 2 tasks</text><text x="655" y="330">similar work</text><text x="825" y="330">similar work</text></g></g><text x="500" y="415" text-anchor="middle" font-family="Arial" font-size="18" fill="#475569">Completion time is often determined by the slowest worker, not the average worker.</text><text x="500" y="455" text-anchor="middle" font-family="Arial" font-size="16" fill="#64748b">Illustrative only: equal task counts do not guarantee equal execution time.</text></svg>