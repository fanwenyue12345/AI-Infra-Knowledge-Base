<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600"><rect width="1100" height="600" rx="22" fill="#f8fafc"/><text x="550" y="42" text-anchor="middle" font-family="Arial" font-size="27" font-weight="bold" fill="#172554">Tensor parallelism: split a matrix operation</text><text x="270" y="105" text-anchor="middle" font-family="Arial" font-size="21" fill="#334155">Column parallel</text><text x="820" y="105" text-anchor="middle" font-family="Arial" font-size="21" fill="#334155">Row parallel</text><g><rect x="90" y="145" width="360" height="170" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><path d="M270 145 V315" stroke="#fff" stroke-width="5"/><rect x="90" y="145" width="180" height="170" fill="#60a5fa"/><rect x="270" y="145" width="180" height="170" fill="#93c5fd"/><text x="180" y="230" text-anchor="middle" font-family="Arial" font-size="20" fill="#fff">W₁</text><text x="360" y="230" text-anchor="middle" font-family="Arial" font-size="20" fill="#1e3a8a">W₂</text><text x="270" y="350" text-anchor="middle" font-family="Arial" font-size="18" fill="#334155">split output columns</text><path d="M450 230 H500" stroke="#64748b" stroke-width="3"/><text x="525" y="235" font-family="Arial" font-size="17" fill="#334155">local Y₁ | Y₂</text><rect x="650" y="145" width="360" height="170" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><path d="M650 230 H1010" stroke="#fff" stroke-width="5"/><rect x="650" y="145" width="360" height="85" fill="#fb923c"/><rect x="650" y="230" width="360" height="85" fill="#fdba74"/><text x="830" y="195" text-anchor="middle" font-family="Arial" font-size="20" fill="#7c2d12">W₁</text><text x="830" y="280" text-anchor="middle" font-family="Arial" font-size="20" fill="#7c2d12">W₂</text><text x="830" y="350" text-anchor="middle" font-family="Arial" font-size="18" fill="#334155">split input dimension</text><path d="M830 315 V385" stroke="#64748b" stroke-width="3"/><rect x="700" y="385" width="260" height="65" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="830" y="425" text-anchor="middle" font-family="Arial" font-size="20" fill="#92400e">sum partial outputs</text><text x="550" y="515" text-anchor="middle" font-family="Arial" font-size="18" fill="#475569">Column split produces output shards; row split produces partial sums that must be combined.</text></svg>