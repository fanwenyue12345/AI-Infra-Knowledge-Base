<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="510" viewBox="0 0 1100 510"><rect width="1100" height="510" rx="22" fill="#f8fafc"/><text x="550" y="42" text-anchor="middle" font-family="Arial" font-size="27" font-weight="bold" fill="#172554">Sequence parallelism: shard the token dimension</text><text x="550" y="105" text-anchor="middle" font-family="Arial" font-size="21" fill="#334155">Sequence activation X: [Batch, Sequence, Hidden]</text><rect x="130" y="135" width="840" height="85" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><path d="M340 135 V220 M550 135 V220 M760 135 V220" stroke="#fff" stroke-width="5"/><g font-family="Arial" font-size="20" text-anchor="middle" fill="#1e40af"><text x="235" y="185">tokens 1–S/4</text><text x="445" y="185">S/4–S/2</text><text x="655" y="185">S/2–3S/4</text><text x="865" y="185">3S/4–S</text></g><path d="M235 220 V275 M445 220 V275 M655 220 V275 M865 220 V275" stroke="#64748b" stroke-width="3"/><g font-family="Arial" text-anchor="middle"><rect x="145" y="275" width="180" height="90" rx="12" fill="#dcfce7" stroke="#16a34a"/><rect x="355" y="275" width="180" height="90" rx="12" fill="#dcfce7" stroke="#16a34a"/><rect x="565" y="275" width="180" height="90" rx="12" fill="#dcfce7" stroke="#16a34a"/><rect x="775" y="275" width="180" height="90" rx="12" fill="#dcfce7" stroke="#16a34a"/><g font-size="20" fill="#166534"><text x="235" y="315">GPU 0</text><text x="445" y="315">GPU 1</text><text x="655" y="315">GPU 2</text><text x="865" y="315">GPU 3</text></g><g font-size="16" fill="#166534"><text x="235" y="342">local tokens</text><text x="445" y="342">local tokens</text><text x="655" y="342">local tokens</text><text x="865" y="342">local tokens</text></g></g><text x="550" y="425" text-anchor="middle" font-family="Arial" font-size="18" fill="#475569">Token-local operations can run on shards; cross-token attention requires communication or distributed algorithms.</text></svg>