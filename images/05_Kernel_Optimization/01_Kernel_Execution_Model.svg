<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500"><rect width="1000" height="500" rx="22" fill="#f8fafc"/><text x="500" y="42" text-anchor="middle" font-family="Arial" font-size="27" font-weight="bold" fill="#172554">From kernel launch to GPU execution</text><rect x="70" y="95" width="190" height="75" rx="13" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="165" y="125" text-anchor="middle" font-family="Arial" font-size="21" fill="#1e40af">Host / CPU</text><text x="165" y="151" text-anchor="middle" font-family="Arial" font-size="16" fill="#1e40af">launch configuration</text><path d="M260 132 H330" stroke="#64748b" stroke-width="3"/><path d="M320 122 L332 132 L320 142" fill="none" stroke="#64748b" stroke-width="3"/><rect x="340" y="95" width="220" height="75" rx="13" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="450" y="140" text-anchor="middle" font-family="Arial" font-size="22" fill="#5b21b6">Kernel Grid</text><path d="M560 132 H625" stroke="#64748b" stroke-width="3"/><path d="M615 122 L627 132 L615 142" fill="none" stroke="#64748b" stroke-width="3"/><rect x="635" y="95" width="285" height="75" rx="13" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="777" y="125" text-anchor="middle" font-family="Arial" font-size="21" fill="#166534">GPU device</text><text x="777" y="151" text-anchor="middle" font-family="Arial" font-size="16" fill="#166534">schedules CTAs onto SMs</text><g font-family="Arial" text-anchor="middle"><rect x="95" y="250" width="220" height="110" rx="13" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="205" y="290" font-size="21" fill="#92400e">Block / CTA</text><text x="205" y="323" font-size="17" fill="#92400e">Warp 0 · Warp 1 · …</text><rect x="390" y="250" width="220" height="110" rx="13" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="500" y="290" font-size="21" fill="#92400e">Block / CTA</text><text x="500" y="323" font-size="17" fill="#92400e">Warp 0 · Warp 1 · …</text><rect x="685" y="250" width="220" height="110" rx="13" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="795" y="290" font-size="21" fill="#92400e">Block / CTA</text><text x="795" y="323" font-size="17" fill="#92400e">Warp 0 · Warp 1 · …</text></g><path d="M777 170 V210 H205 V245 M777 210 H500 V245 M777 210 H795 V245" stroke="#64748b" stroke-width="2.5" fill="none"/><text x="500" y="420" text-anchor="middle" font-family="Arial" font-size="18" fill="#475569">Grid blocks are scheduled as resources become available; not all blocks must run simultaneously.</text></svg>