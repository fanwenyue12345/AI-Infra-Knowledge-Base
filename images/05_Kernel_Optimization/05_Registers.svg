<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520"><rect width="1000" height="520" rx="22" fill="#f8fafc"/><text x="500" y="42" text-anchor="middle" font-family="Arial" font-size="27" font-weight="bold" fill="#172554">Register allocation limits resident threads</text><rect x="100" y="105" width="800" height="100" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="500" y="145" text-anchor="middle" font-family="Arial" font-size="22" fill="#1e40af">SM register file (finite capacity)</text><g><rect x="130" y="245" width="330" height="105" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><rect x="540" y="245" width="330" height="105" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/></g><g font-family="Arial" text-anchor="middle"><text x="295" y="285" font-size="21" fill="#166534">Moderate registers / thread</text><text x="295" y="320" font-size="18" fill="#166534">more resident warps possible</text><text x="705" y="285" font-size="21" fill="#9a3412">High registers / thread</text><text x="705" y="320" font-size="18" fill="#9a3412">fewer resident warps possible</text></g><path d="M295 205 V240 M705 205 V240" stroke="#64748b" stroke-width="3"/><text x="500" y="415" text-anchor="middle" font-family="Arial" font-size="19" fill="#334155">If register demand exceeds available allocation, values may spill to local memory.</text><text x="500" y="455" text-anchor="middle" font-family="Arial" font-size="17" fill="#64748b">Simplified illustration; allocation granularity and limits depend on architecture.</text></svg>