<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540"><rect width="1000" height="540" rx="22" fill="#f8fafc"/><text x="500" y="42" text-anchor="middle" font-family="Arial" font-size="27" font-weight="bold" fill="#172554">Occupancy: active warps / maximum warps</text><text x="260" y="115" text-anchor="middle" font-family="Arial" font-size="21" fill="#334155">Lower occupancy</text><text x="740" y="115" text-anchor="middle" font-family="Arial" font-size="21" fill="#334155">Higher occupancy</text><g><rect x="100" y="155" width="320" height="190" rx="12" fill="#e2e8f0" stroke="#64748b"/><rect x="100" y="155" width="320" height="47" fill="#60a5fa"/><rect x="100" y="202" width="320" height="47" fill="#60a5fa"/><rect x="100" y="249" width="320" height="47" fill="#cbd5e1"/><rect x="100" y="296" width="320" height="49" fill="#cbd5e1"/><rect x="580" y="155" width="320" height="190" rx="12" fill="#e2e8f0" stroke="#64748b"/><rect x="580" y="155" width="320" height="47" fill="#34d399"/><rect x="580" y="202" width="320" height="47" fill="#34d399"/><rect x="580" y="249" width="320" height="47" fill="#34d399"/><rect x="580" y="296" width="320" height="49" fill="#34d399"/></g><g font-family="Arial" font-size="17" text-anchor="middle"><text x="260" y="390" fill="#1e40af">2 / 4 warps = 50%</text><text x="740" y="390" fill="#047857">4 / 4 warps = 100%</text></g><rect x="170" y="435" width="660" height="55" rx="10" fill="#fff7ed" stroke="#fdba74"/><text x="500" y="470" text-anchor="middle" font-family="Arial" font-size="18" fill="#9a3412">Higher occupancy can help hide latency, but does not guarantee higher speed.</text></svg>