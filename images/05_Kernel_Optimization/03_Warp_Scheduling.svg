<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520"><rect width="1100" height="520" rx="22" fill="#f8fafc"/><text x="550" y="42" text-anchor="middle" font-family="Arial" font-size="27" font-weight="bold" fill="#172554">Warp scheduling hides latency</text><text x="85" y="125" font-family="Arial" font-size="19" fill="#334155">Warp 0</text><text x="85" y="220" font-family="Arial" font-size="19" fill="#334155">Warp 1</text><text x="85" y="315" font-family="Arial" font-size="19" fill="#334155">Warp 2</text><text x="85" y="410" font-family="Arial" font-size="19" fill="#334155">Issue slot</text><g><rect x="220" y="90" width="210" height="55" rx="9" fill="#dbeafe" stroke="#2563eb"/><text x="325" y="125" text-anchor="middle" font-family="Arial" font-size="18" fill="#1e40af">Load → waiting</text><rect x="220" y="185" width="210" height="55" rx="9" fill="#dcfce7" stroke="#16a34a"/><text x="325" y="220" text-anchor="middle" font-family="Arial" font-size="18" fill="#166534">Ready instructions</text><rect x="220" y="280" width="210" height="55" rx="9" fill="#dcfce7" stroke="#16a34a"/><text x="325" y="315" text-anchor="middle" font-family="Arial" font-size="18" fill="#166534">Ready instructions</text><path d="M430 117 H500 V405 M430 212 H500 M430 307 H500" stroke="#64748b" stroke-width="2.5" fill="none"/><g fill="#93c5fd"><rect x="550" y="375" width="115" height="55" rx="8"/><rect x="680" y="375" width="115" height="55" rx="8"/></g><g fill="#2563eb"><rect x="810" y="375" width="115" height="55" rx="8"/><rect x="940" y="375" width="100" height="55" rx="8"/></g><g font-family="Arial" font-size="17" text-anchor="middle" fill="#1e3a8a"><text x="607" y="408">Warp 1</text><text x="737" y="408">Warp 2</text><text x="867" y="408">Warp 1</text><text x="990" y="408">Warp 2</text></g></g><text x="550" y="475" text-anchor="middle" font-family="Arial" font-size="17" fill="#64748b">While Warp 0 waits for memory, the scheduler can issue instructions from other eligible warps.</text></svg>