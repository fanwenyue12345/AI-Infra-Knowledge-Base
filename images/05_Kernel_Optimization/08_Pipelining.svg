<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560"><rect width="1100" height="560" rx="22" fill="#f8fafc"/><text x="550" y="42" text-anchor="middle" font-family="Arial" font-size="27" font-weight="bold" fill="#172554">Kernel pipeline: overlap load and compute</text><text x="80" y="170" font-family="Arial" font-size="19" fill="#334155">Load</text><text x="80" y="300" font-family="Arial" font-size="19" fill="#334155">Compute</text><g font-family="Arial" font-size="18" text-anchor="middle"><rect x="220" y="125" width="180" height="65" rx="10" fill="#fdba74" stroke="#ea580c"/><rect x="400" y="255" width="180" height="65" rx="10" fill="#93c5fd" stroke="#2563eb"/><rect x="580" y="125" width="180" height="65" rx="10" fill="#fdba74" stroke="#ea580c"/><rect x="760" y="255" width="180" height="65" rx="10" fill="#93c5fd" stroke="#2563eb"/><rect x="400" y="125" width="180" height="65" rx="10" fill="#fdba74" stroke="#ea580c" opacity=".9"/><text x="310" y="165" fill="#7c2d12">Load tile 0</text><text x="490" y="295" fill="#1e3a8a">Compute tile 0</text><text x="670" y="165" fill="#7c2d12">Load tile 1</text><text x="850" y="295" fill="#1e3a8a">Compute tile 1</text></g><text x="550" y="390" text-anchor="middle" font-family="Arial" font-size="19" fill="#334155">While tile 0 is computed, tile 1 can be prefetched into another buffer.</text><rect x="230" y="430" width="640" height="60" rx="11" fill="#dcfce7" stroke="#16a34a"/><text x="550" y="468" text-anchor="middle" font-family="Arial" font-size="19" fill="#166534">Double buffering / multi-stage pipeline</text></svg>