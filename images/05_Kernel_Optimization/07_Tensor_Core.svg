<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520"><rect width="1000" height="520" rx="22" fill="#f8fafc"/><text x="500" y="42" text-anchor="middle" font-family="Arial" font-size="27" font-weight="bold" fill="#172554">Tensor Core matrix multiply-accumulate</text><g><rect x="80" y="145" width="210" height="180" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><rect x="395" y="145" width="210" height="180" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><rect x="710" y="145" width="210" height="180" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/></g><g font-family="Arial" text-anchor="middle"><text x="185" y="185" font-size="23" fill="#1e40af">A tile</text><text x="500" y="185" font-size="23" fill="#9a3412">B tile</text><text x="815" y="185" font-size="23" fill="#166534">Accumulator D</text><g stroke="#fff" stroke-width="3"><path d="M150 205V305 M220 205V305 M80 255H290 M465 205V305 M535 205V305 M395 255H605 M780 205V305 M850 205V305 M710 255H920"/></g><text x="342" y="245" font-size="32" fill="#64748b">×</text><text x="655" y="245" font-size="32" fill="#64748b">+</text></g><path d="M290 235 H385 M605 235 H700" stroke="#64748b" stroke-width="3"/><text x="500" y="390" text-anchor="middle" font-family="Arial" font-size="23" fill="#334155">D = A × B + C</text><text x="500" y="440" text-anchor="middle" font-family="Arial" font-size="17" fill="#64748b">Conceptual matrix-tile operation. Supported data types and instruction tile shapes vary by GPU generation.</text></svg>