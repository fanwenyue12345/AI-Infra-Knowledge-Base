<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620"><rect width="1100" height="620" rx="24" fill="#f8fafc"/><text x="550" y="45" text-anchor="middle" font-family="Arial" font-size="28" font-weight="bold" fill="#172554">Tiling: divide a large GEMM into reusable blocks</text><text x="160" y="110" text-anchor="middle" font-family="Arial" font-size="21" fill="#334155">A</text><text x="550" y="110" text-anchor="middle" font-family="Arial" font-size="21" fill="#334155">B</text><text x="930" y="110" text-anchor="middle" font-family="Arial" font-size="21" fill="#334155">C output tiles</text><g transform="translate(55 140)"><rect width="210" height="210" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><g stroke="#fff" stroke-width="3"><path d="M70 0V210 M140 0V210 M0 70H210 M0 140H210"/></g><rect x="0" y="0" width="70" height="70" fill="#2563eb"/><rect x="70" y="0" width="70" height="70" fill="#60a5fa"/></g><g transform="translate(445 140)"><rect width="210" height="210" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><g stroke="#fff" stroke-width="3"><path d="M70 0V210 M140 0V210 M0 70H210 M0 140H210"/></g><rect x="0" y="0" width="70" height="70" fill="#ea580c"/><rect x="0" y="70" width="70" height="70" fill="#fb923c"/></g><g transform="translate(825 140)"><rect width="210" height="210" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><g stroke="#fff" stroke-width="3"><path d="M70 0V210 M140 0V210 M0 70H210 M0 140H210"/></g><rect x="0" y="0" width="70" height="70" fill="#16a34a"/><rect x="70" y="0" width="70" height="70" fill="#86efac"/><rect x="0" y="70" width="70" height="70" fill="#86efac"/></g><g stroke="#64748b" stroke-width="3" fill="none"><path d="M270 245 H430 M420 235 L432 245 L420 255 M660 245 H810 M800 235 L812 245 L800 255"/></g><rect x="240" y="410" width="620" height="100" rx="14" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/><text x="550" y="450" text-anchor="middle" font-family="Arial" font-size="21" fill="#5b21b6">For one output tile:</text><text x="550" y="480" text-anchor="middle" font-family="Arial" font-size="19" fill="#5b21b6">load A(M×K) and B(K×N) subtiles → accumulate → write C(M×N)</text><text x="550" y="560" text-anchor="middle" font-family="Arial" font-size="17" fill="#64748b">The K dimension is processed in blocks; tiles are mapped to thread blocks and hardware resources.</text></svg>