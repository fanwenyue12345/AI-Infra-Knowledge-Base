<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520"><rect width="1000" height="520" rx="24" fill="#f8fafc"/><text x="500" y="45" text-anchor="middle" font-family="Arial" font-size="28" font-weight="bold" fill="#172554">Arithmetic intensity = work / data movement</text><text x="250" y="110" text-anchor="middle" font-family="Arial" font-size="21" fill="#334155">Lower data reuse</text><text x="750" y="110" text-anchor="middle" font-family="Arial" font-size="21" fill="#334155">Higher data reuse</text><rect x="95" y="145" width="310" height="80" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="250" y="195" text-anchor="middle" font-family="Arial" font-size="22" fill="#1e40af">100 FLOPs</text><rect x="95" y="255" width="310" height="80" rx="14" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/><text x="250" y="305" text-anchor="middle" font-family="Arial" font-size="22" fill="#991b1b">100 Bytes</text><text x="250" y="390" text-anchor="middle" font-family="Arial" font-size="23" fill="#991b1b">AI = 1 FLOP/Byte</text><rect x="595" y="145" width="310" height="80" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="750" y="195" text-anchor="middle" font-family="Arial" font-size="22" fill="#1e40af">100 FLOPs</text><rect x="595" y="255" width="310" height="80" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="750" y="305" text-anchor="middle" font-family="Arial" font-size="22" fill="#166534">20 Bytes</text><text x="750" y="390" text-anchor="middle" font-family="Arial" font-size="23" fill="#166534">AI = 5 FLOPs/Byte</text><text x="500" y="465" text-anchor="middle" font-family="Arial" font-size="17" fill="#64748b">Illustrative example: same arithmetic work, fewer transferred bytes increases AI.</text></svg>