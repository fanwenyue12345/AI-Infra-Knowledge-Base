<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620"><rect width="1100" height="620" rx="24" fill="#f8fafc"/><text x="550" y="45" text-anchor="middle" font-family="Arial" font-size="28" font-weight="bold" fill="#172554">Data reuse in tiled matrix multiplication</text><text x="180" y="110" text-anchor="middle" font-family="Arial" font-size="21" fill="#1e40af">A tile</text><text x="550" y="110" text-anchor="middle" font-family="Arial" font-size="21" fill="#047857">Reuse across output columns / rows</text><text x="920" y="110" text-anchor="middle" font-family="Arial" font-size="21" fill="#92400e">B tile</text><g><rect x="65" y="150" width="230" height="230" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><g stroke="#fff" stroke-width="3"><path d="M122 150V380 M179 150V380 M236 150V380 M65 207H295 M65 264H295 M65 321H295"/></g><rect x="65" y="207" width="57" height="57" fill="#2563eb"/><rect x="122" y="207" width="57" height="57" fill="#60a5fa"/><rect x="179" y="207" width="57" height="57" fill="#93c5fd"/><rect x="236" y="207" width="57" height="57" fill="#bfdbfe"/><rect x="805" y="150" width="230" height="230" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><g stroke="#fff" stroke-width="3"><path d="M862 150V380 M919 150V380 M976 150V380 M805 207H1035 M805 264H1035 M805 321H1035"/></g><rect x="862" y="150" width="57" height="57" fill="#ea580c"/><rect x="862" y="207" width="57" height="57" fill="#fb923c"/><rect x="862" y="264" width="57" height="57" fill="#fdba74"/><rect x="862" y="321" width="57" height="57" fill="#fed7aa"/><g stroke="#64748b" stroke-width="3" fill="none"><path d="M295 265 H430 M420 255 L432 265 L420 275 M670 265 H800 M790 255 L802 265 L790 275"/></g><rect x="430" y="165" width="240" height="200" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="550" y="205" text-anchor="middle" font-family="Arial" font-size="21" fill="#166534">Output tile C</text><text x="550" y="250" text-anchor="middle" font-family="Arial" font-size="18" fill="#166534">C tile accumulates</text><text x="550" y="282" text-anchor="middle" font-family="Arial" font-size="18" fill="#166534">A tile reused across</text><text x="550" y="312" text-anchor="middle" font-family="Arial" font-size="18" fill="#166534">multiple columns</text><text x="550" y="342" text-anchor="middle" font-family="Arial" font-size="18" fill="#166534">B tile across rows</text><text x="550" y="445" text-anchor="middle" font-family="Arial" font-size="20" fill="#334155">Load a tile once → perform many multiply-accumulate operations → write output tile</text><text x="550" y="490" text-anchor="middle" font-family="Arial" font-size="17" fill="#64748b">Conceptual illustration of reuse; exact thread mapping and tile sizes depend on the kernel.</text></svg>