<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="550" viewBox="0 0 1100 550"><rect width="1100" height="550" rx="24" fill="#f8fafc"/><text x="550" y="45" text-anchor="middle" font-family="Arial" font-size="28" font-weight="bold" fill="#172554">GPU memory allocation and reuse</text><text x="275" y="105" text-anchor="middle" font-family="Arial" font-size="21" fill="#334155">Repeated allocate / free</text><text x="825" y="105" text-anchor="middle" font-family="Arial" font-size="21" fill="#334155">Pool-based reuse</text><g transform="translate(70 145)"><rect width="410" height="220" rx="12" fill="#e2e8f0" stroke="#64748b"/><g><rect x="0" y="0" width="100" height="70" fill="#60a5fa"/><rect x="100" y="0" width="80" height="70" fill="#cbd5e1"/><rect x="180" y="0" width="120" height="70" fill="#34d399"/><rect x="300" y="0" width="110" height="70" fill="#cbd5e1"/><rect x="0" y="70" width="60" height="70" fill="#cbd5e1"/><rect x="60" y="70" width="150" height="70" fill="#fbbf24"/><rect x="210" y="70" width="90" height="70" fill="#cbd5e1"/><rect x="300" y="70" width="110" height="70" fill="#a78bfa"/><rect x="0" y="140" width="120" height="80" fill="#cbd5e1"/><rect x="120" y="140" width="100" height="80" fill="#60a5fa"/><rect x="220" y="140" width="190" height="80" fill="#cbd5e1"/></g></g><g transform="translate(620 145)"><rect width="410" height="220" rx="12" fill="#e2e8f0" stroke="#64748b"/><rect x="0" y="0" width="135" height="110" fill="#60a5fa"/><rect x="135" y="0" width="135" height="110" fill="#34d399"/><rect x="270" y="0" width="140" height="110" fill="#a78bfa"/><rect x="0" y="110" width="135" height="110" fill="#fbbf24"/><rect x="135" y="110" width="135" height="110" fill="#60a5fa"/><rect x="270" y="110" width="140" height="110" fill="#34d399"/></g><text x="275" y="410" text-anchor="middle" font-family="Arial" font-size="18" fill="#475569">Free blocks can become fragmented</text><text x="825" y="410" text-anchor="middle" font-family="Arial" font-size="18" fill="#047857">Reusable blocks are managed by a pool</text><text x="550" y="485" text-anchor="middle" font-family="Arial" font-size="17" fill="#64748b">Conceptual illustration; real allocators use size classes, streams, events and lifetime tracking.</text></svg>