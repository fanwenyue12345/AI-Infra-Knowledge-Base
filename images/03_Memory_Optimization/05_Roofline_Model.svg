<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650"><rect width="1000" height="650" rx="24" fill="#f8fafc"/><text x="500" y="45" text-anchor="middle" font-family="Arial" font-size="28" font-weight="bold" fill="#172554">Roofline performance model</text><line x1="120" y1="520" x2="900" y2="520" stroke="#334155" stroke-width="3"/><line x1="120" y1="520" x2="120" y2="100" stroke="#334155" stroke-width="3"/><text x="520" y="590" text-anchor="middle" font-family="Arial" font-size="20" fill="#334155">Arithmetic Intensity (FLOPs / Byte) →</text><text x="40" y="300" transform="rotate(-90 40 300)" text-anchor="middle" font-family="Arial" font-size="20" fill="#334155">Performance (FLOP/s)</text><path d="M150 490 L560 180 L880 180" fill="none" stroke="#2563eb" stroke-width="6"/><line x1="560" y1="180" x2="560" y2="520" stroke="#f97316" stroke-width="3" stroke-dasharray="9 7"/><text x="340" y="340" font-family="Arial" font-size="20" fill="#1d4ed8">Memory-bound</text><text x="700" y="150" font-family="Arial" font-size="20" fill="#1d4ed8">Compute-bound</text><text x="575" y="215" font-family="Arial" font-size="18" fill="#c2410c">Ridge point</text><text x="575" y="245" font-family="Arial" font-size="17" fill="#c2410c">AI = Ppeak / Bmem</text><text x="500" y="625" text-anchor="middle" font-family="Arial" font-size="16" fill="#64748b">Conceptual upper bound: min(peak compute, arithmetic intensity × memory bandwidth).</text></svg>