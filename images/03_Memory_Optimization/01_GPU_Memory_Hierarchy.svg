<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650"><rect width="1000" height="650" rx="24" fill="#f8fafc"/><text x="500" y="45" text-anchor="middle" font-family="Arial" font-size="28" font-weight="bold" fill="#172554">GPU memory hierarchy (conceptual)</text><g font-family="Arial" text-anchor="middle"><rect x="280" y="90" width="440" height="75" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="500" y="122" font-size="23" font-weight="bold" fill="#166534">Registers</text><text x="500" y="148" font-size="16" fill="#166534">thread-private · very small · very fast</text><rect x="220" y="195" width="560" height="75" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="500" y="227" font-size="23" font-weight="bold" fill="#1e40af">Shared Memory / L1</text><text x="500" y="253" font-size="16" fill="#1e40af">on-chip · block cooperation / cache</text><rect x="160" y="300" width="680" height="75" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="500" y="332" font-size="23" font-weight="bold" fill="#5b21b6">L2 Cache</text><text x="500" y="358" font-size="16" fill="#5b21b6">larger shared cache across SMs</text><rect x="100" y="405" width="800" height="90" rx="14" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="500" y="442" font-size="24" font-weight="bold" fill="#9a3412">Global Memory (HBM / GDDR)</text><text x="500" y="472" font-size="17" fill="#9a3412">large capacity · high aggregate bandwidth · higher access latency</text><g stroke="#64748b" stroke-width="3"><path d="M500 165 V190 M500 270 V295 M500 375 V400"/></g><text x="500" y="550" font-family="Arial" font-size="19" text-anchor="middle" fill="#334155">Moving upward: smaller capacity and closer to execution</text><text x="500" y="582" font-family="Arial" font-size="17" text-anchor="middle" fill="#64748b">Actual organization and sharing rules vary by GPU architecture.</text></svg>