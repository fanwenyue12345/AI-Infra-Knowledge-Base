<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520"><rect width="1100" height="520" rx="22" fill="#f8fafc"/><text x="550" y="42" text-anchor="middle" font-family="Arial" font-size="28" font-weight="bold" fill="#172554">CUDA Graph: capture once, replay many times</text><text x="260" y="100" text-anchor="middle" font-family="Arial" font-size="21" fill="#334155">Repeated eager launches</text><text x="830" y="100" text-anchor="middle" font-family="Arial" font-size="21" fill="#334155">Graph replay</text><g font-family="Arial" text-anchor="middle" font-size="18"><rect x="70" y="145" width="120" height="65" rx="10" fill="#dbeafe" stroke="#2563eb"/><text x="130" y="185">CPU launch</text><rect x="220" y="145" width="120" height="65" rx="10" fill="#dcfce7" stroke="#16a34a"/><text x="280" y="185">Kernel A</text><rect x="370" y="145" width="120" height="65" rx="10" fill="#dcfce7" stroke="#16a34a"/><text x="430" y="185">Kernel B</text><rect x="520" y="145" width="120" height="65" rx="10" fill="#dcfce7" stroke="#16a34a"/><text x="580" y="185">Memcpy</text><path d="M190 178 H215 M340 178 H365 M490 178 H515" stroke="#64748b" stroke-width="3"/><rect x="720" y="135" width="300" height="120" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="870" y="175" font-size="22" fill="#5b21b6">Captured Graph</text><rect x="755" y="195" width="65" height="40" rx="7" fill="#dbeafe" stroke="#2563eb"/><rect x="835" y="195" width="65" height="40" rx="7" fill="#dcfce7" stroke="#16a34a"/><rect x="915" y="195" width="65" height="40" rx="7" fill="#ffedd5" stroke="#ea580c"/><path d="M820 215 H830 M900 215 H910" stroke="#64748b" stroke-width="2"/><rect x="720" y="315" width="300" height="70" rx="12" fill="#fef3c7" stroke="#d97706"/><text x="870" y="357" font-size="21" fill="#92400e">One Graph Launch / Replay</text><path d="M870 255 V310" stroke="#64748b" stroke-width="3"/><text x="550" y="450" text-anchor="middle" font-family="Arial" font-size="18" fill="#475569">Graph replay reduces repeated host submission overhead; GPU work remains the same unless separately optimized.</text></svg>