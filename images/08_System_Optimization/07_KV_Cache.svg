<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="570" viewBox="0 0 1100 570"><rect width="1100" height="570" rx="22" fill="#f8fafc"/><text x="550" y="42" text-anchor="middle" font-family="Arial" font-size="28" font-weight="bold" fill="#172554">Autoregressive decoding reuses cached Keys and Values</text><g font-family="Arial" text-anchor="middle"><rect x="80" y="115" width="200" height="90" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="180" y="150" font-size="21" fill="#1e40af">New token xₜ</text><text x="180" y="180" font-size="17" fill="#1e40af">compute Qₜ, Kₜ, Vₜ</text><path d="M280 160 H360" stroke="#64748b" stroke-width="3"/><rect x="370" y="115" width="260" height="90" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="500" y="150" font-size="21" fill="#166534">Append Kₜ and Vₜ</text><text x="500" y="180" font-size="17" fill="#166534">to historical cache</text><path d="M630 160 H710" stroke="#64748b" stroke-width="3"/><rect x="720" y="115" width="300" height="90" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="870" y="150" font-size="21" fill="#9a3412">Attention with Qₜ</text><text x="870" y="180" font-size="17" fill="#9a3412">against K≤ₜ, V≤ₜ</text></g><rect x="160" y="285" width="780" height="125" rx="14" fill="#e2e8f0" stroke="#64748b"/><text x="550" y="320" text-anchor="middle" font-family="Arial" font-size="21" fill="#334155">KV Cache (per layer / head)</text><g><rect x="220" y="345" width="110" height="45" fill="#93c5fd"/><rect x="330" y="345" width="110" height="45" fill="#93c5fd"/><rect x="440" y="345" width="110" height="45" fill="#93c5fd"/><rect x="550" y="345" width="110" height="45" fill="#86efac"/><rect x="660" y="345" width="110" height="45" fill="#cbd5e1"/><rect x="770" y="345" width="110" height="45" fill="#cbd5e1"/></g><g font-family="Arial" font-size="16" text-anchor="middle"><text x="275" y="373" fill="#1e3a8a">K/V₁</text><text x="385" y="373" fill="#1e3a8a">K/V₂</text><text 