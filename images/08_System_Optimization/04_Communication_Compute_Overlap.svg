<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560"><rect width="1100" height="560" rx="22" fill="#f8fafc"/><text x="550" y="42" text-anchor="middle" font-family="Arial" font-size="28" font-weight="bold" fill="#172554">Overlap gradient communication with backward compute</text><text x="90" y="150" font-family="Arial" font-size="19" fill="#334155">Compute</text><text x="90" y="285" font-family="Arial" font-size="19" fill="#334155">AllReduce</text><g><rect x="220" y="110" width="190" height="65" rx="9" fill="#93c5fd" stroke="#2563eb"/><rect x="410" y="110" width="190" height="65" rx="9" fill="#60a5fa" stroke="#2563eb"/><rect x="600" y="110" width="190" height="65" rx="9" fill="#93c5fd" stroke="#2563eb"/><rect x="410" y="245" width="190" height="65" rx="9" fill="#fdba74" stroke="#ea580c"/><rect x="600" y="245" width="190" height="65" rx="9" fill="#fb923c" stroke="#ea580c"/></g><g font-family="Arial" font-size="18" text-anchor="middle"><text x="315" y="150" fill="#1e3a8a">Backward layer 3</text><text x="505" y="150" fill="#1e3a8a">Backward layer 2</text><text x="695" y="150" fill="#1e3a8a">Backward layer 1</text><text x="505" y="285" fill="#7c2d12">AllReduce bucket 3</text><text x="695" y="285" fill="#7c2d12">AllReduce bucket 2</text></g><text x="550" y="390" text-anchor="middle" font-family="Arial" font-size="19" fill="#334155">A bucket can communicate after its gradients are ready</text><text x="550" y="435" text-anchor="middle" font-family="Arial" font-size="17" fill="#64748b">The overlap is constrained by dependencies and competition for GPU / network resources.</text></svg>