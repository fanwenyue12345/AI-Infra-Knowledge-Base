<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="570" viewBox="0 0 1100 570"><rect width="1100" height="570" rx="22" fill="#f8fafc"/><text x="550" y="42" text-anchor="middle" font-family="Arial" font-size="28" font-weight="bold" fill="#172554">End-to-end performance: optimize the complete request path</text><g font-family="Arial" text-anchor="middle" font-size="19"><rect x="45" y="145" width="150" height="90" rx="11" fill="#dbeafe" stroke="#2563eb"/><text x="120" y="180" fill="#1e40af">Queue</text><text x="120" y="210" fill="#1e40af">wait</text><rect x="220" y="145" width="150" height="90" rx="11" fill="#dcfce7" stroke="#16a34a"/><text x="295" y="180" fill="#166534">Preprocess</text><text x="295" y="210" fill="#166534">tokenize</text><rect x="395" y="145" width="150" height="90" rx="11" fill="#ffedd5" stroke="#ea580c"/><text x="470" y="180" fill="#9a3412">Schedule</text><text x="470" y="210" fill="#9a3412">batch / cache</text><rect x="570" y="145" width="150" height="90" rx="11" fill="#ede9fe" stroke="#7c3aed"/><text x="645" y="180" fill="#5b21b6">GPU compute</text><text x="645" y="210" fill="#5b21b6">kernels</text><rect x="745" y="145" width="150" height="90" rx="11" fill="#fce7f3" stroke="#db2777"/><text x="820" y="180" fill="#9d174d">Communication</text><text x="820" y="210" fill="#9d174d">network</text><rect x="920" y="145" width="140" height="90" rx="11" fill="#e2e8f0" stroke="#64748b"/><text x="990" y="180" fill="#334155">Return</text><text x="990" y="210" fill="#334155">response</text><g stroke="#64748b" stroke-width="3"><path d="M195 190 H215 M370 190 H390 M545 190 H565 M720 190 H740 M895 190 H915"/></g></g><rect x="140" y="315" width="820" height="120" rx="14" fill="#f1f5f9" stroke="#94a3b8"/><text x="550" y="355" text-anchor="middle" font-family="Arial" font-size="22" fill="#334155">Measure the full path, not only one fast Kernel</text><text x="550" y="390" text-anchor="middle" font-family="Arial" font-size="18" fill="#475569">Latency · Throughput · TTFT · TPOT · P95/P99 · Memory · Cost</text><text x="550" y="490" text-anchor="middle" font-family="Arial" font-size="17" fill="#64748b">The critical path and queueing behavior determine user-visible performance.</text></svg>