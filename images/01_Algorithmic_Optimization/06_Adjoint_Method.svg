<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
<rect width="1200" height="680" rx="24" fill="#f8fafc"/>
<text x="600" y="50" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#172554">Adjoint method: forward state solve and backward sensitivity</text>
<text x="75" y="125" font-family="Arial" font-size="22" font-weight="700" fill="#1d4ed8">Forward problem</text>
<g font-family="Arial" font-size="20" text-anchor="middle">
<rect x="70" y="165" width="200" height="90" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="170" y="205" fill="#1e3a8a">Parameters m</text><text x="170" y="232" fill="#1e3a8a" font-size="16">inputs / design</text>
<rect x="365" y="165" width="260" height="90" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="495" y="205" fill="#1e3a8a">State equation</text><text x="495" y="232" fill="#1e3a8a" font-size="16">F(u,m) = 0</text>
<rect x="720" y="165" width="180" height="90" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="810" y="218" fill="#1e3a8a">State u</text>
<rect x="980" y="165" width="160" height="90" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="1060" y="205" fill="#1e3a8a">Objective</text><text x="1060" y="232" fill="#1e3a8a" font-size="16">J(u,m)</text>
<g stroke="#2563eb" stroke-width="4" fill="none"><path d="M270 210 H360 M350 200 L362 210 L350 220"/><path d="M625 210 H715 M705 200 L717 210 L705 220"/><path d="M900 210 H975 M965 200 L977 210 L965 220"/></g>
</g>
<line x1="70" y1="325" x2="1135" y2="325" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="8 8"/>
<text x="75" y="390" font-family="Arial" font-size="22" font-weight="700" fill="#be123c">Adjoint / backward sensitivity</text>
<g font-family="Arial" font-size="20" text-anchor="middle">
<rect x="980" y="430" width="160" height="90" rx="14" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/><text x="1060" y="483" fill="#9f1239">J sensitivity</text>
<rect x="650" y="430" width="230" height="90" rx="14" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/><text x="765" y="470" fill="#9f1239">Adjoint variable λ</text><text x="765" y="496" font-size="16" fill="#9f1239">Fᵤᵀ λ = Jᵤᵀ</text>
<rect x="300" y="430" width="250" height="90" rx="14" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/><text x="425" y="470" fill="#9f1239">Parameter gradient</text><text x="425" y="496" font-size="16" fill="#9f1239">dJ/dm = Jₘ − λᵀFₘ</text>
<g stroke="#e11d48" stroke-width="4" fill="none"><path d="M980 475 H885 M895 465 L883 475 L895 485"/><path d="M650 475 H555 M565 465 L553 475 L565 485"/></g>
</g>
<text x="600" y="590" text-anchor="middle" font-family="Arial" font-size="18" fill="#475569">The forward solve obtains the state; the adjoint solve propagates objective sensitivity back to parameters.</text>
</svg>