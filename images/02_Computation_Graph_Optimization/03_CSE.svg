<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430"><rect width="1000" height="430" rx="20" fill="#f8fafc"/><text x="500" y="42" text-anchor="middle" font-family="Arial" font-size="26" font-weight="bold" fill="#172554">Common subexpression elimination</text><text x="245" y="95" text-anchor="middle" font-family="Arial" font-size="21" fill="#334155">Before: duplicate x + y</text><text x="750" y="95" text-anchor="middle" font-family="Arial" font-size="21" fill="#334155">After: shared t</text><g font-family="Arial" font-size="20" text-anchor="middle"><rect x="85" y="135" width="150" height="60" rx="10" fill="#dbeafe" stroke="#2563eb"/><text x="160" y="173">x + y</text><rect x="275" y="135" width="150" height="60" rx="10" fill="#dbeafe" stroke="#2563eb"/><text x="350" y="173">x + y</text><rect x="85" y="265" width="150" height="60" rx="10" fill="#fef3c7" stroke="#d97706"/><text x="160" y="303">× z → a</text><rect x="275" y="265" width="150" height="60" rx="10" fill="#fef3c7" stroke="#d97706"/><text x="350" y="303">× w → b</text><path d="M160 195 V260 M350 195 V260" stroke="#64748b" stroke-width="3"/><rect x="665" y="135" width="170" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="750" y="173">t = x + y</text><rect x="570" y="265" width="150" height="60" rx="10" fill="#fef3c7" stroke="#d97706"/><text x="645" y="303">t × z → a</text><rect x="780" y="265" width="150" height="60" rx="10" fill="#fef3c7" stroke="#d97706"/><text x="855" y="303">t × w → b</text><path d="M750 195 L645 260 M750 195 L855 260" stroke="#16a34a" stroke-width="3" fill="none"/></g><text x="500" y="385" text-anchor="middle" font-family="Arial" font-size="17" fill="#475569">Reuse is valid only if the expression has the same value at both uses.</text></svg>