<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500"><rect width="1100" height="500" rx="20" fill="#f8fafc"/><text x="550" y="42" text-anchor="middle" font-family="Arial" font-size="26" font-weight="bold" fill="#172554">Forward computation and reverse-mode gradients</text><text x="70" y="110" font-family="Arial" font-size="21" font-weight="bold" fill="#1d4ed8">Forward</text><g font-family="Arial" font-size="20" text-anchor="middle"><rect x="80" y="140" width="120" height="60" rx="10" fill="#dbeafe" stroke="#2563eb"/><text x="140" y="178">x, y</text><rect x="330" y="140" width="150" height="60" rx="10" fill="#dbeafe" stroke="#2563eb"/><text x="405" y="178">a = x + y</text><rect x="610" y="140" width="140" height="60" rx="10" fill="#dbeafe" stroke="#2563eb"/><text x="680" y="178">z = a²</text><rect x="880" y="140" width="140" height="60" rx="10" fill="#dcfce7" stroke="#16a34a"/><text x="950" y="178">loss L</text><path d="M200 170 H325 M480 170 H605 M750 170 H875" stroke="#2563eb" stroke-width="3"/></g><text x="70" y="280" font-family="Arial" font-size="21" font-weight="bold" fill="#be123c">Backward</text><g font-family="Arial" font-size="20" text-anchor="middle"><rect x="880" y="310" width="140" height="60" rx="10" fill="#ffe4e6" stroke="#e11d48"/><text x="950" y="348">∂L/∂z</text><rect x="610" y="310" width="140" height="60" rx="10" fill="#ffe4e6" stroke="#e11d48"/><text x="680" y="348">∂L/∂a</text><rect x="330" y="310" width="150" height="60" rx="10" fill="#ffe4e6" stroke="#e11d48"/><text x="405" y="348">∂L/∂x, ∂L/∂y</text><path d="M880 340 H755 M765 330 L753 340 L765 350 M610 340 H485 M495 330 L483 340 L495 350" stroke="#e11d48" stroke-width="3" fill="none"/></g><text x="550" y="440" text-anchor="middle" font-family="Arial" font-size="17" fill="#475569">At a shared dependency, gradient contributions from multiple paths are accumulated.</text></svg>