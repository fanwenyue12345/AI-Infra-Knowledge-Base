<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450"><rect width="1000" height="450" rx="20" fill="#f8fafc"/><text x="500" y="42" text-anchor="middle" font-family="Arial" font-size="26" font-weight="bold" fill="#172554">Operator fusion: avoid materializing an intermediate</text><text x="245" y="95" text-anchor="middle" font-family="Arial" font-size="21" fill="#334155">Unfused</text><text x="745" y="95" text-anchor="middle" font-family="Arial" font-size="21" fill="#334155">Fused</text><g font-family="Arial" font-size="20" text-anchor="middle"><rect x="65" y="135" width="130" height="65" rx="12" fill="#dbeafe" stroke="#2563eb"/><text x="130" y="175">t = x + b</text><rect x="260" y="135" width="130" height="65" rx="12" fill="#fef3c7" stroke="#d97706"/><text x="325" y="175">write/read t</text><rect x="455" y="135" width="130" height="65" rx="12" fill="#dcfce7" stroke="#16a34a"/><text x="520" y="175">ReLU(t)</text><path d="M195 167 H255 M390 167 H450" stroke="#64748b" stroke-width="3"/><rect x="665" y="135" width="160" height="65" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="745" y="175">one kernel</text><text x="745" y="240" fill="#166534">yᵢ = max(xᵢ+bᵢ, 0)</text></g><rect x="65" y="290" width="520" height="85" rx="12" fill="#fff7ed" stroke="#fdba74"/><text x="325" y="325" text-anchor="middle" font-family="Arial" font-size="18" fill="#9a3412">Intermediate tensor traffic + multiple launches</text><text x="325" y="353" text-anchor="middle" font-family="Arial" font-size="16" fill="#9a3412">separate producer and consumer kernels</text><rect x="665" y="290" width="160" height="85" rx="12" fill="#ecfdf5" stroke="#6ee7b7"/><text x="745" y="325" text-anchor="middle" font-family="Arial" font-size="18" fill="#047857">no materialized t</text><text x="745" y="353" text-anchor="middle" font-family="Arial" font-size="16" fill="#047857">one launch</text></svg>