<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420"><rect width="1000" height="420" rx="20" fill="#f8fafc"/><text x="500" y="42" text-anchor="middle" font-family="Arial" font-size="26" font-weight="bold" fill="#172554">Computation graph: data dependencies</text><g font-family="Arial" font-size="22" text-anchor="middle"><rect x="80" y="120" width="110" height="58" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="135" y="157">x</text><rect x="80" y="245" width="110" height="58" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="135" y="282">y</text><rect x="330" y="180" width="160" height="65" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="410" y="220">a = x + y</text><rect x="620" y="180" width="160" height="65" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="700" y="220">z = a × w</text><rect x="330" y="300" width="110" height="58" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="385" y="337">w</text><rect x="850" y="180" width="100" height="65" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="900" y="220">output</text><g stroke="#64748b" stroke-width="3" fill="none"><path d="M190 149 L325 193 M190 274 L325 232 M490 212 H615 M440 329 L665 250 M780 212 H845"/></g></g><text x="500" y="395" text-anchor="middle" font-family="Arial" font-size="17" fill="#475569">An edge means the destination operation depends on the source value.</text></svg>