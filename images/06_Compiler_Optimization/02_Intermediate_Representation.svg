<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="540" viewBox="0 0 1100 540"><rect width="1100" height="540" rx="22" fill="#f8fafc"/><text x="550" y="42" text-anchor="middle" font-family="Arial" font-size="27" font-weight="bold" fill="#172554">One computation, multiple IR abstraction levels</text><g font-family="Arial" text-anchor="middle"><rect x="100" y="100" width="900" height="95" rx="13" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="550" y="137" font-size="22" fill="#1e40af">High-level tensor IR</text><text x="550" y="170" font-size="19" fill="#1e40af">Y = MatMul(X, W) + bias</text><path d="M550 195 V230" stroke="#64748b" stroke-width="3"/><path d="M540 220 L550 232 L560 220" stroke="#64748b" stroke-width="3" fill="none"/><rect x="100" y="240" width="900" height="95" rx="13" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="550" y="277" font-size="22" fill="#166534">Loop / affine IR</text><text x="550" y="310" font-size="19" fill="#166534">for i, j, k: Y[i,j] += X[i,k] × W[k,j]</text><path d="M550 335 V370" stroke="#64748b" stroke-width="3"/><path d="M540 360 L550 372 L560 360" stroke="#64748b" stroke-width="3" fill="none"/><rect x="100" y="380" width="900" height="95" rx="13" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="550" y="417" font-size="22" fill="#92400e">Low-level / machine-oriented IR</text><text x="550" y="450" font-size="19" fill="#92400e">loads · address arithmetic · multiply-add · stores</text></g><text x="550" y="510" text-anchor="middle" font-family="Arial" font-size="17" fill="#64748b">Higher levels preserve tensor semantics; lower levels expose implementation details.</text></svg>