<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470"><rect width="1000" height="470" rx="22" fill="#f8fafc"/><text x="500" y="42" text-anchor="middle" font-family="Arial" font-size="27" font-weight="bold" fill="#172554">Compiler decides a legal fusion region</text><text x="245" y="105" text-anchor="middle" font-family="Arial" font-size="21" fill="#334155">Before fusion</text><text x="750" y="105" text-anchor="middle" font-family="Arial" font-size="21" fill="#334155">After fusion</text><g font-family="Arial" font-size="19" text-anchor="middle"><rect x="75" y="145" width="130" height="65" rx="10" fill="#dbeafe" stroke="#2563eb"/><text x="140" y="185">Add</text><rect x="255" y="145" width="130" height="65" rx="10" fill="#dbeafe" stroke="#2563eb"/><text x="320" y="185">Bias</text><rect x="435" y="145" width="130" height="65" rx="10" fill="#dbeafe" stroke="#2563eb"/><text x="500" y="185">ReLU</text><path d="M205 177 H250 M385 177 H430" stroke="#64748b" stroke-width="3"/><rect x="675" y="135" width="160" height="85" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="755" y="170" fill="#166534">Fused</text><text x="755" y="198" fill="#166534">Kernel</text><path d="M565 177 H670" stroke="#64748b" stroke-width="3"/></g><rect x="75" y="280" width="490" height="95" rx="12" fill="#fff7ed" stroke="#fdba74"/><text x="320" y="320" text-anchor="middle" font-family="Arial" font-size="18" fill="#9a3412">Compiler checks dependencies, side effects,</text><text x="320" y="350" text-anchor="middle" font-family="Arial" font-size="18" fill="#9a3412">resource pressure and fusion profitability</text><rect x="675" y="280" width="160" height="95" rx="12" fill="#ecfdf5" stroke="#6ee7b7"/><text x="755" y="320" text-anchor="middle" font-family="Arial" font-size="18" fill="#047857">One launch</text><text x="755" y="350" text-anchor="middle" font-family="Arial" font-size="16" fill="#047857">less intermediate IO</text></svg>