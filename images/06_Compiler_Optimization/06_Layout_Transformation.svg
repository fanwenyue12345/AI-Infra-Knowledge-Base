<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="550" viewBox="0 0 1100 550"><rect width="1100" height="550" rx="22" fill="#f8fafc"/><text x="550" y="42" text-anchor="middle" font-family="Arial" font-size="27" font-weight="bold" fill="#172554">Same logical matrix, different physical layout</text><text x="260" y="105" text-anchor="middle" font-family="Arial" font-size="21" fill="#334155">Row-major address order</text><text x="820" y="105" text-anchor="middle" font-family="Arial" font-size="21" fill="#334155">Column-major address order</text><g transform="translate(120 145)" font-family="Arial" text-anchor="middle" font-size="19"><rect width="280" height="210" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><path d="M70 0V210 M140 0V210 M210 0V210 M0 70H280 M0 140H280" stroke="#fff" stroke-width="3"/><g fill="#1e40af"><text x="35" y="42">0</text><text x="105" y="42">1</text><text x="175" y="42">2</text><text x="245" y="42">3</text><text x="35" y="112">4</text><text x="105" y="112">5</text><text x="175" y="112">6</text><text x="245" y="112">7</text><text x="35" y="182">8</text><text x="105" y="182">9</text><text x="175" y="182">10</text><text x="245" y="182">11</text></g></g><g transform="translate(680 145)" font-family="Arial" text-anchor="middle" font-size="19"><rect width="280" height="210" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><path d="M70 0V210 M140 0V210 M210 0V210 M0 70H280 M0 140H280" stroke="#fff" stroke-width="3"/><g fill="#9a3412"><text x="35" y="42">0</text><text x="105" y="42">3</text><text x="175" y="42">6</text><text x="245" y="42">9</text><text x="35" y="112">1</text><text x="105" y="112">4</text><text x="175" y="112">7</text><text x="245" y="112">10</text><text x="35" y="182">2</text><text x="105" y="182">5</text><text x="175" y="182">8</text><text x="245" y="182">11</text></g></g><text x="550" y="415" text-anchor="middle" font-family="Arial" font-size="20" fill="#334155">Logical indices (i, j) are unchanged; the address mapping is different.</text><text x="550" y="465" text-anchor="middle" font-family="Arial" font-size="17" fill="#64748b">Layout also determines which thread owns each element and how warp accesses are coalesced.</text></svg>