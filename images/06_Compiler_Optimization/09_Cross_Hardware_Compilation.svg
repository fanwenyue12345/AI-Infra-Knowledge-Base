<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="540" viewBox="0 0 1100 540"><rect width="1100" height="540" rx="22" fill="#f8fafc"/><text x="550" y="42" text-anchor="middle" font-family="Arial" font-size="27" font-weight="bold" fill="#172554">One portable representation, multiple hardware backends</text><rect x="360" y="85" width="380" height="75" rx="13" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="550" y="130" text-anchor="middle" font-family="Arial" font-size="22" fill="#5b21b6">Portable IR / program model</text><path d="M550 160 V205 M165 205 H935 M165 205 V245 M420 205 V245 M680 205 V245 M935 205 V245" stroke="#64748b" stroke-width="3" fill="none"/><g font-family="Arial" text-anchor="middle"><rect x="70" y="245" width="190" height="110" rx="13" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="165" y="285" font-size="22" fill="#1e40af">NVIDIA GPU</text><text x="165" y="320" font-size="17" fill="#1e40af">PTX / SASS</text><rect x="325" y="245" width="190" height="110" rx="13" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="420" y="285" font-size="22" fill="#166534">AMD GPU</text><text x="420" y="320" font-size="17" fill="#166534">ROCDL / AMD ISA</text><rect x="585" y="245" width="190" height="110" rx="13" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="680" y="285" font-size="22" fill="#92400e">CPU</text><text x="680" y="320" font-size="17" fill="#92400e">LLVM / native ISA</text><rect x="840" y="245" width="190" height="110" rx="13" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="935" y="285" font-size="22" fill="#9a3412">Other accelerator</text><text x="935" y="320" font-size="17" fill="#9a3412">target backend</text></g><text x="550" y="420" text-anchor="middle" font-family="Arial" font-size="20" fill="#334155">Each backend maps operations to its own ISA, memory model and capabilities.</text><text x="550" y="465" text-anchor="middle" font-family="Arial" font-size="17" fill="#64748b">Portability does not imply identical performance or bitwise-identical floating-point results.</text></svg>