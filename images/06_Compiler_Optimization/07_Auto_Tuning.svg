<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500"><rect width="1000" height="500" rx="22" fill="#f8fafc"/><text x="500" y="42" text-anchor="middle" font-family="Arial" font-size="27" font-weight="bold" fill="#172554">Auto-tuning: search, compile, measure, select</text><g font-family="Arial" text-anchor="middle"><rect x="60" y="145" width="175" height="100" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="147" y="185" font-size="21" fill="#1e40af">Candidate</text><text x="147" y="215" font-size="18" fill="#1e40af">configurations</text><rect x="285" y="145" width="175" height="100" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="372" y="185" font-size="21" fill="#166534">Compile</text><text x="372" y="215" font-size="18" fill="#166534">kernel variants</text><rect x="510" y="145" width="175" height="100" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="597" y="185" font-size="21" fill="#92400e">Benchmark</text><text x="597" y="215" font-size="18" fill="#92400e">and validate</text><rect x="735" y="145" width="190" height="100" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="830" y="185" font-size="21" fill="#5b21b6">Select best</text><text x="830" y="215" font-size="18" fill="#5b21b6">valid candidate</text><g stroke="#64748b" stroke-width="3"><path d="M235 195 H280 M270 185 L282 195 L270 205 M460 195 H505 M495 185 L507 195 L495 205 M685 195 H730 M720 185 L732 195 L720 205"/></g></g><path d="M830 245 V320 H372 V250" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 6"/><text x="600" y="350" text-anchor="middle" font-family="Arial" font-size="18" fill="#64748b">Search strategy proposes the next configuration based on prior measurements.</text><text x="500" y="425" text-anchor="middle" font-family="Arial" font-size="17" fill="#475569">Correctness constraints must be checked before comparing performance.</text></svg>