<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520"><rect width="1100" height="520" rx="22" fill="#f8fafc"/><text x="550" y="42" text-anchor="middle" font-family="Arial" font-size="27" font-weight="bold" fill="#172554">Code generation: IR becomes target instructions</text><g font-family="Arial" text-anchor="middle"><rect x="70" y="145" width="190" height="100" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="165" y="185" font-size="21" fill="#1e40af">Low-level IR</text><text x="165" y="215" font-size="17" fill="#1e40af">operations + types</text><rect x="330" y="145" width="190" height="100" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="425" y="185" font-size="21" fill="#166534">Instruction</text><text x="425" y="215" font-size="17" fill="#166534">selection</text><rect x="590" y="145" width="190" height="100" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="685" y="185" font-size="21" fill="#92400e">Register alloc.</text><text x="685" y="215" font-size="17" fill="#92400e">+ scheduling</text><rect x="850" y="145" width="190" height="100" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="945" y="185" font-size="21" fill="#5b21b6">Target code</text><text x="945" y="215" font-size="17" fill="#5b21b6">ISA / binary</text><g stroke="#64748b" stroke-width="3"><path d="M260 195 H325 M315 185 L327 195 L315 205 M520 195 H585 M575 185 L587 195 L575 205 M780 195 H845 M835 185 L847 195 L835 205"/></g></g><rect x="190" y="320" width="720" height="85" rx="12" fill="#e2e8f0" stroke="#64748b"/><text x="550" y="355" text-anchor="middle" font-family="Arial" font-size="20" fill="#334155">GPU example: CUDA C++ → PTX → SASS machine instructions</text><text x="550" y="385" text-anchor="middle" font-family="Arial" font-size="17" fill="#475569">PTX is a virtual ISA; SASS is architecture-specific machine code.</text><text x="550" y="460" text-anchor="middle" font-family="Arial" font-size="17" fill="#64748b">The exact toolchain stages depend on language, compiler and target architecture.</text></svg>